<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="app-loading">
  <!-- Title Bar -->
  <div class="title-bar" id="titleBar">
    <div class="title-bar-drag">
      <div class="app-logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
          <line x1="8" y1="21" x2="16" y2="21"/>
          <line x1="12" y1="17" x2="12" y2="21"/>
        </svg>
        <span>Expense Tracker</span>
      </div>
    </div>
    <div class="window-controls">
      <button class="win-btn" id="minimizeBtn" title="Minimize">
        <svg width="12" height="12" viewBox="0 0 12 12"><rect y="5" width="12" height="2" fill="currentColor" rx="1"/></svg>
      </button>
      <button class="win-btn win-close" id="closeBtn" title="Close">
        <svg width="12" height="12" viewBox="0 0 12 12"><path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>

  <!-- Welcome Screen -->
  <section class="welcome-screen" id="welcomeScreen" aria-labelledby="welcomeTitle" aria-hidden="true">
    <div class="welcome-sparkle sparkle-one" aria-hidden="true">&#10022;</div>
    <div class="welcome-sparkle sparkle-two" aria-hidden="true">&#10022;</div>
    <div class="welcome-coin coin-one" aria-hidden="true">$</div>

    <div class="welcome-pig-wrap">
      <svg class="piggy-illustration" viewBox="0 0 320 290" role="img" aria-label="A smiling piggy bank catching a coin">
        <defs>
          <filter id="pigShadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#c85b75" flood-opacity="0.2"/>
          </filter>
        </defs>

        <ellipse class="pig-ground-shadow" cx="161" cy="247" rx="103" ry="14"/>

        <g class="pig-tail">
          <path d="M260 135c32-17 32 29 10 22-11-4-3-19 6-11" fill="none" stroke="#f37a91" stroke-width="12" stroke-linecap="round"/>
        </g>

        <g class="pig-bank" filter="url(#pigShadow)">
          <path class="pig-ear" d="M206 94c15-31 44-35 51-13 5 17-10 40-40 42z"/>
          <path class="pig-ear-inner" d="M218 99c9-16 24-20 28-9 3 10-6 23-25 28z"/>

          <path class="pig-body" d="M85 118c23-36 72-51 119-35 36 12 59 43 57 79-2 44-36 73-91 76-51 3-96-18-107-57-8-29 0-52 22-63z"/>
          <ellipse class="pig-belly" cx="169" cy="190" rx="65" ry="43"/>

          <rect class="pig-leg" x="102" y="219" width="31" height="35" rx="13"/>
          <rect class="pig-leg" x="205" y="219" width="31" height="35" rx="13"/>
          <path class="pig-hoof" d="M107 244h21"/>
          <path class="pig-hoof" d="M210 244h21"/>

          <path class="pig-slot" d="M151 117c14-4 31-3 45 2"/>

          <ellipse class="pig-snout" cx="85" cy="174" rx="39" ry="34"/>
          <ellipse class="pig-snout-highlight" cx="75" cy="163" rx="14" ry="10"/>
          <ellipse class="pig-nostril" cx="73" cy="181" rx="5" ry="7"/>
          <ellipse class="pig-nostril" cx="97" cy="181" rx="5" ry="7"/>

          <ellipse class="pig-eye" cx="117" cy="145" rx="5" ry="8"/>
          <path class="pig-eyelash" d="M113 135l-4-4M119 134l2-5"/>
          <path class="pig-smile" d="M110 193c8 13 23 16 34 8"/>
          <ellipse class="pig-cheek" cx="123" cy="180" rx="12" ry="7"/>
          <circle class="pig-highlight" cx="148" cy="132" r="9"/>
        </g>

        <g class="pig-coin-drop">
          <circle class="pig-coin-face" cx="170" cy="55" r="20"/>
          <circle class="pig-coin-ring" cx="170" cy="55" r="14"/>
          <text class="pig-coin-symbol" x="170" y="63" text-anchor="middle">$</text>
        </g>

        <path class="pig-sparkle sparkle-left" d="M52 101l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/>
        <path class="pig-sparkle sparkle-right" d="M279 185l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
      </svg>
    </div>

    <div class="welcome-copy">
      <p class="welcome-kicker">A little more room to breathe</p>
      <h1 id="welcomeTitle">Meet your money buddy.</h1>
      <p>Small steps, clearer spending, happier savings.</p>
    </div>

    <button class="get-started-btn" id="getStartedBtn" type="button">
      <span>Get Started</span>
      <span class="get-started-arrow" aria-hidden="true">&#8594;</span>
    </button>
  </section>

  <!-- Main Content -->
  <div class="main-content">

    <!-- Budget Header -->
    <div class="budget-header" id="budgetHeader">
      <div class="budget-ring-wrapper">
        <svg class="budget-ring" viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="52" class="ring-bg" />
          <circle cx="60" cy="60" r="52" class="ring-progress" id="ringProgress"
            stroke-dasharray="326.73" stroke-dashoffset="0" />
        </svg>
        <div class="budget-ring-text">
          <span class="budget-spent" id="spentAmount">$0</span>
          <span class="budget-label">spent</span>
        </div>
      </div>
      <div class="budget-info">
        <div class="budget-amount-row">
          <span class="budget-of">of</span>
          <span class="budget-total" id="budgetAmount">$0</span>
        </div>
        <span class="budget-period" id="budgetPeriod">today</span>
        <div class="budget-remaining" id="remainingAmount">
          <span class="remaining-value">$0</span>
          <span class="remaining-label">remaining</span>
        </div>
      </div>
      <button class="settings-btn" id="settingsBtn" title="Settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
      </button>
    </div>

    <!-- Period Tabs -->
    <div class="period-tabs" id="periodTabs">
      <button class="tab active" data-period="daily">Daily</button>
      <button class="tab" data-period="weekly">Weekly</button>
      <button class="tab" data-period="monthly">Monthly</button>
    </div>

    <!-- Quick Add Expense -->
    <div class="add-expense" id="addExpenseSection">
      <div class="add-expense-form" id="addForm">
        <div class="form-row">
          <div class="input-group amount-group">
            <span class="input-prefix">$</span>
            <input type="number" id="expenseAmount" placeholder="0.00" step="0.01" min="0" autocomplete="off">
          </div>
          <select id="expenseCategory">
            <option value="Food & Drink">🍕 Food</option>
            <option value="Transport">🚗 Transport</option>
            <option value="Shopping">🛍️ Shopping</option>
            <option value="Entertainment">🎬 Entertainment</option>
            <option value="Bills">📄 Bills</option>
            <option value="Healthcare">💊 Health</option>
            <option value="Education">📚 Education</option>
            <option value="Housing">🏠 Housing</option>
            <option value="Other">📌 Other</option>
          </select>
        </div>
        <div class="form-row">
          <input type="text" id="expenseDescription" placeholder="What was it for? (optional)" autocomplete="off">
          <button class="add-btn" id="addExpenseBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Overspend Alert -->
    <div class="overspend-alert hidden" id="overspendAlert">
      <div class="alert-icon">⚠️</div>
      <div class="alert-text">
        <span class="alert-title">Over budget!</span>
        <span class="alert-sub" id="overspendText">You're $0 over</span>
      </div>
    </div>

    <!-- Transactions Section -->
    <div class="transactions-section">
      <div class="section-header">
        <h2>Transactions</h2>
        <button class="show-all-btn" id="showAllBtn">All Time</button>
      </div>
      <div class="transactions-list" id="transactionsList">
        <!-- Populated by JS -->
      </div>
    </div>

  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay hidden" id="settingsModal">
    <div class="modal">
      <div class="modal-header">
        <h2>Budget Settings</h2>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body">
        <div class="modal-field">
          <label>Budget Type</label>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="budgetType" value="daily" checked>
              <span>Daily</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="budgetType" value="weekly">
              <span>Weekly</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="budgetType" value="monthly">
              <span>Monthly</span>
            </label>
          </div>
        </div>
        <div class="modal-field">
          <label>Budget Amount</label>
          <div class="input-group large">
            <span class="input-prefix">$</span>
            <input type="number" id="modalBudgetAmount" placeholder="0.00" step="0.01" min="0">
          </div>
        </div>
        <div class="modal-field">
          <label class="switch-row">
            <span>Overspend Notifications</span>
            <label class="switch">
              <input type="checkbox" id="notifToggle" checked>
              <span class="slider"></span>
            </label>
          </label>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" id="modalCancel">Cancel</button>
        <button class="btn-primary" id="modalSave">Save Budget</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
