<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Title Bar -->
  <div class="title-bar" id="titleBar">
    <div class="title-bar-drag">
      <div class="app-logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
          <line x1="8" y1="21" x2="16" y2="21"/>
          <line x1="12" y1="17" x2="12" y2="21"/>
        </svg>
        <span>Expense Tracker</span>
      </div>
    </div>
    <div class="window-controls">
      <button class="win-btn" id="minimizeBtn" title="Minimize">
        <svg width="12" height="12" viewBox="0 0 12 12"><rect y="5" width="12" height="2" fill="currentColor" rx="1"/></svg>
      </button>
      <button class="win-btn win-close" id="closeBtn" title="Close">
        <svg width="12" height="12" viewBox="0 0 12 12"><path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main-content">

    <!-- Budget Header -->
    <div class="budget-header" id="budgetHeader">
      <div class="budget-ring-wrapper">
        <svg class="budget-ring" viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="52" class="ring-bg" />
          <circle cx="60" cy="60" r="52" class="ring-progress" id="ringProgress"
            stroke-dasharray="326.73" stroke-dashoffset="0" />
        </svg>
        <div class="budget-ring-text">
          <span class="budget-spent" id="spentAmount">$0</span>
          <span class="budget-label">spent</span>
        </div>
      </div>
      <div class="budget-info">
        <div class="budget-amount-row">
          <span class="budget-of">of</span>
          <span class="budget-total" id="budgetAmount">$0</span>
        </div>
        <span class="budget-period" id="budgetPeriod">today</span>
        <div class="budget-remaining" id="remainingAmount">
          <span class="remaining-value">$0</span>
          <span class="remaining-label">remaining</span>
        </div>
      </div>
      <button class="settings-btn" id="settingsBtn" title="Settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
      </button>
    </div>

    <!-- Period Tabs -->
    <div class="period-tabs" id="periodTabs">
      <button class="tab active" data-period="daily">Daily</button>
      <button class="tab" data-period="weekly">Weekly</button>
      <button class="tab" data-period="monthly">Monthly</button>
    </div>

    <!-- Quick Add Expense -->
    <div class="add-expense" id="addExpenseSection">
      <div class="add-expense-form" id="addForm">
        <div class="form-row">
          <div class="input-group amount-group">
            <span class="input-prefix">$</span>
            <input type="number" id="expenseAmount" placeholder="0.00" step="0.01" min="0" autocomplete="off">
          </div>
          <select id="expenseCategory">
            <option value="Food & Drink">🍕 Food</option>
            <option value="Transport">🚗 Transport</option>
            <option value="Shopping">🛍️ Shopping</option>
            <option value="Entertainment">🎬 Entertainment</option>
            <option value="Bills">📄 Bills</option>
            <option value="Healthcare">💊 Health</option>
            <option value="Education">📚 Education</option>
            <option value="Housing">🏠 Housing</option>
            <option value="Other">📌 Other</option>
          </select>
        </div>
        <div class="form-row">
          <input type="text" id="expenseDescription" placeholder="What was it for? (optional)" autocomplete="off">
          <button class="add-btn" id="addExpenseBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Overspend Alert -->
    <div class="overspend-alert hidden" id="overspendAlert">
      <div class="alert-icon">⚠️</div>
      <div class="alert-text">
        <span class="alert-title">Over budget!</span>
        <span class="alert-sub" id="overspendText">You're $0 over</span>
      </div>
    </div>

    <!-- Transactions Section -->
    <div class="transactions-section">
      <div class="section-header">
        <h2>Transactions</h2>
        <button class="show-all-btn" id="showAllBtn">All Time</button>
      </div>
      <div class="transactions-list" id="transactionsList">
        <!-- Populated by JS -->
      </div>
    </div>

  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay hidden" id="settingsModal">
    <div class="modal">
      <div class="modal-header">
        <h2>Budget Settings</h2>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body">
        <div class="modal-field">
          <label>Budget Type</label>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="budgetType" value="daily" checked>
              <span>Daily</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="budgetType" value="weekly">
              <span>Weekly</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="budgetType" value="monthly">
              <span>Monthly</span>
            </label>
          </div>
        </div>
        <div class="modal-field">
          <label>Budget Amount</label>
          <div class="input-group large">
            <span class="input-prefix">$</span>
            <input type="number" id="modalBudgetAmount" placeholder="0.00" step="0.01" min="0">
          </div>
        </div>
        <div class="modal-field">
          <label class="switch-row">
            <span>Overspend Notifications</span>
            <label class="switch">
              <input type="checkbox" id="notifToggle" checked>
              <span class="slider"></span>
            </label>
          </label>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" id="modalCancel">Cancel</button>
        <button class="btn-primary" id="modalSave">Save Budget</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
